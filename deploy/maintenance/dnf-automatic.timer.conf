# Surcharge du minuteur de dnf-automatic (/etc/systemd/system/dnf-automatic.timer.d/arena.conf) : chaque nuit à
# 3 h 30, heure de Paris, sans délai aléatoire ; rattrapé au démarrage si la machine était éteinte.
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:30:00 Europe/Paris
RandomizedDelaySec=0
Persistent=true
