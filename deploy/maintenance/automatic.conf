# Mises à jour de sécurité automatiques du serveur (dnf-automatic), installé par deploy/install.sh dans
# /etc/dnf/automatic.conf. Lancé chaque nuit à 3 h 30, heure de Paris (dnf-automatic.timer.conf) ; le redémarrage
# éventuel a lieu à 4 h (arena-maintenance).
[commands]
upgrade_type = security
random_sleep = 0
download_updates = yes
apply_updates = yes

[emitters]
emit_via = stdio

[base]
debuglevel = 1
