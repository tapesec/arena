# Rotation du journal des événements de jeu (/etc/logrotate.d/arena, installé par deploy/install.sh). copytruncate : le
# serveur garde son fichier ouvert ; l'agent CloudWatch suit la troncature (une ligne écrite pile entre la copie et la
# troncature peut manquer dans la copie locale, pas dans CloudWatch si l'agent l'a déjà lue). Tout est déjà envoyé à CloudWatch Logs
# (gardé 30 jours) : une semaine suffit sur la machine.
/var/log/arena/events.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
