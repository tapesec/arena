# Seul point d'entrée public du serveur : HTTPS (certificat Origin CA de Cloudflare, mode « Full (strict) ») vers le
# serveur de jeu en local (pages, requêtes et WebSocket). Le groupe de sécurité n'ouvre le 443 qu'à Cloudflare, et
# nginx n'accepte que les connexions qui présentent le certificat client de la zone (Authenticated Origin Pulls,
# infra/main/origin_pull.tf) : une autre zone Cloudflare pointée sur l'IP est refusée.
# Installé par deploy/install.sh dans /etc/nginx/conf.d/arena.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/arena/origin.pem;
    ssl_certificate_key /etc/nginx/arena/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    ssl_client_certificate /etc/nginx/arena/origin-pull.pem;
    ssl_verify_client      on;

    server_tokens off;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        # Une partie dure plusieurs minutes : la WebSocket ne doit pas être coupée faute de trafic.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
