# Déploiement à chaque push sur main :
#   test   : typage et tests (ci.yml) ;
#   plan   : plan Terraform de infra/main (rôle en lecture seule), à relire dans le résumé du run, enregistré ;
#   build  : build du client et archive du serveur, SANS aucun accès AWS (les scripts d'installation des dépendances
#            ne voient jamais d'identifiants) ;
#   deploy : après validation manuelle (environnement « production »), applique exactement le plan relu, envoie
#            l'archive et installe le serveur sur l'EC2 par Session Manager (deploy/install.sh).
# Ne jamais déclencher ce workflow par pull_request_target, issue_comment ni workflow_run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  TF_VERSION: 1.17.2

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Journaux publics (dépôt public) : le numéro du compte y est masqué.
      - name: Masquage du compte
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      - run: terraform plan -input=false -lock=false -no-color -out=tfplan | tee plan.txt
      - name: Résumé (à relire avant de valider le déploiement)
        if: always()
        run: |
          { echo '```'; tail -n 200 plan.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: infra/main/tfplan
          retention-days: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sans manifeste, le jeu publié chercherait ses assets sur le serveur, qui ne les a pas (dépôt sans assets).
      - name: Assets publiés ?
        id: assets
        run: |
          if [ "$(jq length packages/client/src/assets-manifest.json)" = "0" ]; then
            echo "::warning::Manifeste des assets vide : lancer npm run deploy-assets puis commiter le manifeste. Serveur non déployé."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.assets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: steps.assets.outputs.ready == 'true'
        env:
          VITE_SOUND_KEY: ${{ secrets.VITE_SOUND_KEY }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf release.tar.gz package.json package-lock.json packages/shared packages/server \
            packages/client/package.json packages/client/dist deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.assets.outputs.ready == 'true'
        with:
          name: release
          path: release.tar.gz
          retention-days: 1
    outputs:
      ready: ${{ steps.assets.outputs.ready }}

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra/main
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Masquage du compte
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Le plan relu est appliqué tel quel ; si l'état a changé depuis, Terraform refuse (relancer le workflow).
      - name: Terraform apply
        id: infra
        working-directory: infra/main
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          terraform apply -input=false -no-color tfplan
          {
            echo "instance=$(terraform output -raw server_instance_id)"
            echo "releases=$(terraform output -raw releases_bucket)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.outputs.ready == 'true'
        with:
          name: release

      - name: Installation sur le serveur
        if: needs.build.outputs.ready == 'true'
        env:
          INSTANCE: ${{ steps.infra.outputs.instance }}
          BUCKET: ${{ steps.infra.outputs.releases }}
          # Un dossier par tentative : relancer un run ne réinstalle jamais par-dessus la version en service.
          RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          aws s3 cp release.tar.gz "s3://$BUCKET/releases/$RELEASE.tar.gz" --only-show-errors

          # Un serveur tout juste créé met quelques minutes à s'annoncer à Session Manager.
          status=""
          for _ in $(seq 1 60); do
            status=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$status" = "Online" ] && break
            sleep 10
          done
          [ "$status" = "Online" ] || { echo "::error::Le serveur n'est pas joignable par Session Manager."; exit 1; }

          dir="/opt/arena/releases/$RELEASE"
          jq -n --arg region "$AWS_REGION" --arg dir "$dir" --arg src "s3://$BUCKET/releases/$RELEASE.tar.gz" \
            --arg tmp "/tmp/arena-$RELEASE.tar.gz" '{
            commands: [
              "set -euo pipefail",
              "mkdir -p \($dir)",
              "aws s3 cp \($src) \($tmp) --region \($region) --only-show-errors",
              "tar --no-same-owner -xzf \($tmp) -C \($dir)",
              "rm -f \($tmp)",
              "bash \($dir)/deploy/install.sh \($dir)"
            ],
            executionTimeout: ["1800"]
          }' > command.json
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "Deploiement $RELEASE" --parameters file://command.json --query Command.CommandId --output text)

          # Au plus 35 minutes (le délai de la commande est de 30).
          status=Pending
          for _ in $(seq 1 210); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed|Cancelling) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          [ "$status" = "Success" ] || { echo "::error::Installation : $status"; exit 1; }
