# Déploiement à chaque push sur main :
#   test   : typage et tests (ci.yml) ;
#   plan   : plan Terraform de infra/main (rôle en lecture seule), à relire dans le résumé du run, enregistré ;
#   build  : build du client et archive du serveur, SANS aucun accès AWS (les scripts d'installation des dépendances
#            ne voient jamais d'identifiants) ;
#   deploy : après validation manuelle (environnement « production »), applique exactement le plan relu, envoie
#            l'archive et installe le serveur sur l'EC2 par Session Manager (deploy/install.sh).
# Ne jamais déclencher ce workflow par pull_request_target, issue_comment ni workflow_run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

# bash explicite : GitHub ajoute alors « -o pipefail » (sinon « terraform plan | tee » réussit même en échec).
defaults:
  run:
    shell: bash

env:
  AWS_REGION: eu-west-3
  TF_VERSION: 1.17.2

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Journaux publics (dépôt public) : le numéro du compte y est masqué.
      - name: Masquage du compte
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      # Jeton Cloudflare en lecture seule ; il n'est pas enregistré dans tfplan (lu dans l'environnement).
      - run: terraform plan -input=false -lock=false -no-color -out=tfplan | tee plan.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
      - name: Résumé (à relire avant de valider le déploiement)
        if: always()
        run: |
          { echo '```'; tail -n 200 plan.txt 2>/dev/null || echo "(aucun plan : voir l'étape en échec)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Le plan enregistré contient l'état et les données lues (numéro de compte, IP du serveur, compte Cloudflare) ;
      # les artefacts d'un dépôt public sont téléchargeables par tous : il n'est envoyé que chiffré (gpg, intègre).
      - name: Chiffrement du plan
        env:
          TFPLAN_KEY: ${{ secrets.TFPLAN_KEY }}
        run: |
          [ -n "$TFPLAN_KEY" ] || { echo "::error::Secret TFPLAN_KEY manquant."; exit 1; }
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output tfplan.gpg tfplan <<< "$TFPLAN_KEY"
          rm -f tfplan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: infra/main/tfplan.gpg
          retention-days: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sans manifeste, le jeu publié chercherait ses assets sur le serveur, qui ne les a pas (dépôt sans assets).
      - name: Assets publiés ?
        id: assets
        run: |
          if [ "$(jq length packages/client/src/assets-manifest.json)" = "0" ]; then
            echo "::warning::Manifeste des assets vide : lancer npm run deploy-assets puis commiter le manifeste. Serveur non déployé."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.assets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: steps.assets.outputs.ready == 'true'
        env:
          VITE_SOUND_KEY: ${{ secrets.VITE_SOUND_KEY }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf release.tar.gz package.json package-lock.json packages/shared packages/server \
            packages/client/package.json packages/client/dist deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.assets.outputs.ready == 'true'
        with:
          name: release
          path: release.tar.gz
          retention-days: 1
    outputs:
      ready: ${{ steps.assets.outputs.ready }}

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra/main
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Masquage du compte
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Le plan relu est appliqué tel quel ; si l'état a changé depuis, Terraform refuse (relancer le workflow).
      - name: Terraform apply
        id: infra
        working-directory: infra/main
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          # Jeton d'écriture : secret de l'environnement production, disponible seulement après validation.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TFPLAN_KEY: ${{ secrets.TFPLAN_KEY }}
        run: |
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 --decrypt --output tfplan tfplan.gpg \
            <<< "$TFPLAN_KEY"
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          terraform apply -input=false -no-color tfplan
          # Chaque sortie lue dans une variable : une sortie absente arrête l'étape (« echo x=$(…) » l'ignorerait).
          out() { local v; v=$(terraform output -raw "$1"); [ -n "$v" ] || { echo "::error::Sortie $1 vide."; exit 1; }; printf '%s' "$v"; }
          instance=$(out server_instance_id)
          releases=$(out releases_bucket)
          zone=$(out cloudflare_zone_id)
          pull_cert_id=$(out origin_pull_certificate_id)
          # Autorité publique (sans clé) du certificat client de Cloudflare : remise au serveur avec la version.
          pull_ca=$(out origin_pull_ca | base64 -w0)
          {
            echo "instance=$instance"
            echo "releases=$releases"
            echo "zone=$zone"
            echo "pull_cert_id=$pull_cert_id"
            echo "pull_ca=$pull_ca"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.outputs.ready == 'true'
        with:
          name: release

      - name: Installation sur le serveur
        if: needs.build.outputs.ready == 'true'
        env:
          INSTANCE: ${{ steps.infra.outputs.instance }}
          BUCKET: ${{ steps.infra.outputs.releases }}
          ZONE: ${{ steps.infra.outputs.zone }}
          PULL_CERT_ID: ${{ steps.infra.outputs.pull_cert_id }}
          PULL_CA: ${{ steps.infra.outputs.pull_ca }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Un dossier par tentative : relancer un run ne réinstalle jamais par-dessus la version en service.
          RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # nginx exige le certificat client de la zone : attendre que Cloudflare le présente (déploiement de
          # quelques minutes après un envoi), sinon le site serait refusé entre-temps.
          state=""
          for _ in $(seq 1 60); do
            state=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE/origin_tls_client_auth/$PULL_CERT_ID" | jq -r .result.status) || state=""
            case "$state" in active|deployment_timed_out|deleted) break ;; esac
            sleep 10
          done
          [ "$state" = "active" ] || { echo "::error::Certificat origin pull non actif chez Cloudflare ($state)."; exit 1; }

          aws s3 cp release.tar.gz "s3://$BUCKET/releases/$RELEASE.tar.gz" --only-show-errors

          # Un serveur tout juste créé met quelques minutes à s'annoncer à Session Manager.
          status=""
          for _ in $(seq 1 60); do
            status=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$status" = "Online" ] && break
            sleep 10
          done
          [ "$status" = "Online" ] || { echo "::error::Le serveur n'est pas joignable par Session Manager."; exit 1; }

          dir="/opt/arena/releases/$RELEASE"
          jq -n --arg region "$AWS_REGION" --arg dir "$dir" --arg src "s3://$BUCKET/releases/$RELEASE.tar.gz" \
            --arg tmp "/tmp/arena-$RELEASE.tar.gz" --arg cert "$PULL_CA" '{
            commands: [
              "set -euo pipefail",
              "mkdir -p \($dir)",
              "aws s3 cp \($src) \($tmp) --region \($region) --only-show-errors",
              "tar --no-same-owner -xzf \($tmp) -C \($dir)",
              "rm -f \($tmp)",
              "echo \($cert) | base64 -d > \($dir)/origin-pull.pem",
              "bash \($dir)/deploy/install.sh \($dir)"
            ],
            executionTimeout: ["1800"]
          }' > command.json
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "Deploiement $RELEASE" --parameters file://command.json --query Command.CommandId --output text)

          # Au plus 35 minutes (le délai de la commande est de 30).
          status=Pending
          for _ in $(seq 1 210); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed|Cancelling) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          [ "$status" = "Success" ] || { echo "::error::Installation : $status"; exit 1; }
