# Typage et tests, à chaque pull request et avant chaque déploiement (appelé par deploy.yml sur main).
# Le dépôt n'a pas les assets (licences) ni la clé des sons : les tests qui en ont besoin sont sautés.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# bash explicite : GitHub ajoute alors « -o pipefail » (sinon « terraform plan | tee » réussit même en échec).
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
