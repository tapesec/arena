# Plan Terraform de infra/main sur les pull requests qui le touchent, en lecture seule (rôle arena-github-plan, sans
# verrou de l'état). Les pull requests venues de forks n'obtiennent pas de jeton OIDC : elles n'ont aucun accès AWS.
# Ne jamais déclencher ce workflow par pull_request_target, issue_comment ni workflow_run.
name: Terraform plan

on:
  pull_request:
    paths:
      - "infra/main/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write

# bash explicite : GitHub ajoute alors « -o pipefail » (sinon « terraform plan | tee » réussit même en échec).
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-3
      # Journaux publics (dépôt public) : le numéro du compte y est masqué.
      - name: Masquage du compte
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      - run: terraform fmt -check
      # Jeton Cloudflare en lecture seule (le jeton d'écriture n'est donné qu'à l'apply, dans l'environnement production).
      - run: terraform plan -input=false -lock=false -no-color | tee plan.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
      - name: Résumé
        if: always()
        run: |
          { echo '```'; tail -n 200 plan.txt 2>/dev/null || echo "(aucun plan : voir l'étape en échec)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
